name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Pure Android APK
        run: |
          mkdir -p build/assets build/res/values build/res/drawable build/src/com/nxtbeverage/dispatch build/gen build/obj build/bin

          # মূল ফাইল কপি (index.htm অথবা index.html)
          if [ -f index.htm ]; then
            cp index.htm build/assets/index.html
          elif [ -f index.html ]; then
            cp index.html build/assets/index.html
          fi

          if [ -f manifest.json ]; then cp manifest.json build/assets/; fi

          # কাস্টম লোগো থাকলে বসানো
          if [ -f icon.png ]; then
            cp icon.png build/res/drawable/app_icon.png
          fi

          # AndroidManifest.xml (ক্যামেরা ও স্টোরেজ পারমিশন সহ)
          cat << 'EOF' > build/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.nxtbeverage.dispatch"
              android:versionCode="5"
              android:versionName="1.4">
              <uses-sdk android:minSdkVersion="21" android:targetSdkVersion="34" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
              <uses-feature android:name="android.hardware.camera" android:required="false" />
              <application
                  android:label="@string/app_name"
                  android:icon="@drawable/app_icon"
                  android:roundIcon="@drawable/app_icon"
                  android:allowBackup="true"
                  android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # strings.xml
          cat << 'EOF' > build/res/values/strings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">NXT Dispatch</string>
          </resources>
          EOF

          # MainActivity.java (ক্যামেরা পারমিশন প্রম্পট ও ফাইল আপলোড সাপোর্ট)
          cat << 'EOF' > build/src/com/nxtbeverage/dispatch/MainActivity.java
          package com.nxtbeverage.dispatch;

          import android.Manifest;
          import android.app.Activity;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.webkit.PermissionRequest;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView webView;
              private ValueCallback<Uri[]> uploadMessage;
              private final static int FILECHOOSER_RESULTCODE = 1;
              private final static int PERMISSION_REQ_CODE = 200;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  webView = new WebView(this);
                  setContentView(webView);

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      if (checkSelfPermission(Manifest.permission.CAMERA) != PackageManager.PERMISSION_GRANTED) {
                          requestPermissions(new String[]{Manifest.permission.CAMERA}, PERMISSION_REQ_CODE);
                      }
                  }

                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setAllowFileAccess(true);
                  s.setAllowContentAccess(true);
                  s.setDatabaseEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);

                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onPermissionRequest(final PermissionRequest request) {
                          request.grant(request.getResources());
                      }

                      @Override
                      public boolean onShowFileChooser(WebView webView, ValueCallback<Uri[]> filePathCallback, FileChooserParams fileChooserParams) {
                          if (uploadMessage != null) {
                              uploadMessage.onReceiveValue(null);
                              uploadMessage = null;
                          }
                          uploadMessage = filePathCallback;

                          Intent intent = fileChooserParams.createIntent();
                          try {
                              startActivityForResult(intent, FILECHOOSER_RESULTCODE);
                          } catch (Exception e) {
                              uploadMessage = null;
                              return false;
                          }
                          return true;
                      }
                  });

                  webView.loadUrl("file:///android_asset/index.html");
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  if (requestCode == FILECHOOSER_RESULTCODE) {
                      if (uploadMessage == null) return;
                      uploadMessage.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(resultCode, data));
                      uploadMessage = null;
                  } else {
                      super.onActivityResult(requestCode, resultCode, data);
                  }
              }

              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

          SDK_ROOT=$ANDROID_HOME
          BUILD_TOOLS=$SDK_ROOT/build-tools/34.0.0
          PLATFORM=$SDK_ROOT/platforms/android-34/android.jar

          $BUILD_TOOLS/aapt2 compile --dir build/res -o build/compiled_res.zip
          $BUILD_TOOLS/aapt2 link -I $PLATFORM -A build/assets --manifest build/AndroidManifest.xml -o build/bin/base.apk --java build/gen build/compiled_res.zip --auto-add-overlay

          javac -cp $PLATFORM -d build/obj build/gen/com/nxtbeverage/dispatch/R.java build/src/com/nxtbeverage/dispatch/MainActivity.java

          $BUILD_TOOLS/d8 $(find build/obj -name "*.class") --output build/bin/

          cd build/bin
          $BUILD_TOOLS/aapt add base.apk classes.dex
          cd ../..

          keytool -genkey -v -keystore build/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=NXT,O=NXTBEVERAGE,C=IN"
          $BUILD_TOOLS/zipalign -v -p 4 build/bin/base.apk build/NXT-Dispatch.apk
          $BUILD_TOOLS/apksigner sign --ks build/debug.keystore --ks-pass pass:android --key-pass pass:android build/NXT-Dispatch.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NXT-Dispatch-App
          path: build/NXT-Dispatch.apk
