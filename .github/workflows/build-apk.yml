name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download & Build Lightweight Android App
        run: |
          git clone https://github.com/dandar3/android-webview-app.git app-project
          mkdir -p app-project/app/src/main/assets
          cp index.html app-project/app/src/main/assets/
          sed -i 's|https://example.com|file:///android_asset/index.html|g' app-project/app/src/main/java/com/example/webviewapp/MainActivity.java || true
          cd app-project
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Smart-Order-App
          path: app-project/app/build/outputs/apk/debug/*.apk
