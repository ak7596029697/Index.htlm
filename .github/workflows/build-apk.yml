name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Pure Android APK
        run: |
          # ডিরেক্টরি তৈরি
          mkdir -p build/assets build/res/values build/src/com/smartorder/app build/gen build/obj build/bin

          # ওয়েব ফাইল কপি
          cp index.html build/assets/
          if [ -f manifest.json ]; then cp manifest.json build/assets/; fi

          # AndroidManifest.xml
          cat << 'EOF' > build/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.smartorder.app"
              android:versionCode="1"
              android:versionName="1.0">
              <uses-sdk android:minSdkVersion="21" android:targetSdkVersion="34" />
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:label="Smart Order"
                  android:allowBackup="true"
                  android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # strings.xml
          cat << 'EOF' > build/res/values/strings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Smart Order</string>
          </resources>
          EOF

          # Java Activity (Pure Android WebView, No external libraries needed)
          cat << 'EOF' > build/src/com/smartorder/app/MainActivity.java
          package com.smartorder.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setAllowFileAccess(true);
                  s.setAllowContentAccess(true);
                  s.setDatabaseEnabled(true);

                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient());
                  webView.loadUrl("file:///android_asset/index.html");
              }

              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

          # SDK টুলস পাথ
          SDK_ROOT=$ANDROID_HOME
          BUILD_TOOLS=$SDK_ROOT/build-tools/34.0.0
          PLATFORM=$SDK_ROOT/platforms/android-34/android.jar

          # ১. রিসোর্স কম্পাইল ও লিঙ্কিং
          $BUILD_TOOLS/aapt2 compile --dir build/res -o build/compiled_res.zip
          $BUILD_TOOLS/aapt2 link -I $PLATFORM -A build/assets --manifest build/AndroidManifest.xml -o build/bin/base.apk --java build/gen build/compiled_res.zip --auto-add-overlay

          # ২. জাভা কোড কম্পাইল
          javac -cp $PLATFORM -d build/obj build/gen/com/smartorder/app/R.java build/src/com/smartorder/app/MainActivity.java

          # ৩. DEX জেনারেশন (d8)
          $BUILD_TOOLS/d8 $(find build/obj -name "*.class") --output build/bin/

          # ৪. APK-র ভেতর DEX যোগ করা
          cd build/bin
          $BUILD_TOOLS/aapt add base.apk classes.dex
          cd ../..

          # ৫. টেস্ট কী তৈরি ও সাইনিং
          keytool -genkey -v -keystore build/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=AndroidDebug,O=Android,C=US"
          $BUILD_TOOLS/zipalign -v -p 4 build/bin/base.apk build/Smart-Order.apk
          $BUILD_TOOLS/apksigner sign --ks build/debug.keystore --ks-pass pass:android --key-pass pass:android build/Smart-Order.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Smart-Order-App
          path: build/Smart-Order.apk
