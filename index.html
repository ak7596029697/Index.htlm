<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Fast Order Scanner</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="https://unpkg.com/@zxing/library@latest"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: #0b0f19; color: #f8fafc; padding: 12px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    .header { text-align: center; margin-bottom: 8px; width: 100%; max-width: 450px; }
    .header h1 { font-size: 18px; color: #38bdf8; }
    .camera-box { position: relative; width: 100%; max-width: 450px; height: 260px; border-radius: 12px; overflow: hidden; background: #000; border: 2px solid #334155; }
    video { width: 100%; height: 100%; object-fit: cover; }
    .aim-box { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 85%; height: 80px; border: 2px dashed #38bdf8; border-radius: 8px; box-shadow: 0 0 0 9999px rgba(0,0,0,0.55); pointer-events: none; }
    .controls { width: 100%; max-width: 450px; display: flex; gap: 8px; margin-top: 10px; }
    button { flex: 1; padding: 12px; font-size: 15px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; }
    .btn-snap { background: #2563eb; color: white; }
    .btn-export { background: #10b981; color: white; }
    .btn-clear { background: #ef4444; color: white; flex: 0 0 45px; }
    .status { width: 100%; max-width: 450px; background: #1e293b; padding: 10px; border-radius: 8px; margin-top: 10px; font-size: 13px; text-align: center; border-left: 4px solid #38bdf8; }
    .list-box { width: 100%; max-width: 450px; margin-top: 12px; flex-grow: 1; }
    ul { list-style: none; max-height: 220px; overflow-y: auto; background: #1e293b; border-radius: 8px; }
    li { display: flex; justify-content: space-between; padding: 8px 12px; border-bottom: 1px solid #334155; font-family: monospace; font-size: 12px; }
  </style>
</head>
<body>

  <div class="header">
    <h1>📦 Smart Order Scanner</h1>
    <p style="font-size:11px; color:#94a3b8;">লেখা বা বারকোড বক্সে এনে "স্ক্যান চাপুন"</p>
  </div>

  <div class="camera-box">
    <video id="video" autoplay playsinline muted></video>
    <div class="aim-box"></div>
    <canvas id="canvas" style="display:none;"></canvas>
  </div>

  <div class="controls">
    <button class="btn-snap" id="snapBtn" onclick="processFrame()">📸 স্ক্যান করুন</button>
    <button class="btn-export" onclick="exportExcel()">📥 Excel</button>
    <button class="btn-clear" onclick="clearData()">🗑️</button>
  </div>

  <div class="status" id="statusBox">ক্যামেরা চালু হচ্ছে...</div>

  <div class="list-box">
    <h4 style="font-size:13px; margin-bottom:6px;">তালিকা (<span id="count">0</span>):</h4>
    <ul id="itemsList"></ul>
  </div>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const statusBox = document.getElementById('statusBox');
    const itemsList = document.getElementById('itemsList');
    const countBadge = document.getElementById('count');
    const snapBtn = document.getElementById('snapBtn');

    let scannedData = JSON.parse(localStorage.getItem('saved_orders') || '[]');
    let worker = null;
    let codeReader = null;

    const patterns = [
      { name: "Flipkart", regex: /OD\d{16,20}/i },
      { name: "Amazon",   regex: /\d{3}-\d{7}-\d{7}/ },
      { name: "Meesho",   regex: /\d{16,20}_\d+/ }
    ];

    function updateUI() {
      itemsList.innerHTML = '';
      scannedData.slice().reverse().forEach((item, index) => {
        const li = document.createElement('li');
        li.innerHTML = `<span><b>#${scannedData.length - index}</b> [${item.platform}] ${item.id}</span> <span>${item.time}</span>`;
        itemsList.appendChild(li);
      });
      countBadge.innerText = scannedData.length;
      localStorage.setItem('saved_orders', JSON.stringify(scannedData));
    }

    function addOrderId(rawId, platform) {
      let id = rawId.trim().toUpperCase();
      if (!scannedData.some(d => d.id === id)) {
        let now = new Date();
        scannedData.push({
          id: id,
          platform: platform,
          time: now.toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'}),
          date: now.toISOString().slice(0, 10)
        });
        if (navigator.vibrate) navigator.vibrate(120);
        updateUI();
        statusBox.style.borderLeftColor = "#10b981";
        statusBox.innerHTML = `✅ [${platform}] সেভ হয়েছে: <b>${id}</b>`;
      } else {
        statusBox.style.borderLeftColor = "#f59e0b";
        statusBox.innerHTML = `⚠️ আগেই নেওয়া হয়েছে: <b>${id}</b>`;
      }
    }

    async function initCamera() {
      updateUI();
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: "environment",
            width: { ideal: 1920 },
            height: { ideal: 1080 }
          }
        });
        video.srcObject = stream;
        statusBox.innerText = "ক্যামেরা তৈরি। বক্সে লেখা রেখে 'স্ক্যান করুন' চাপুন।";
      } catch (err) {
        statusBox.innerText = "ক্যামেরা পারমিশন অন করুন!";
      }

      codeReader = new ZXing.BrowserMultiFormatReader();
      worker = await Tesseract.createWorker('eng');
    }

    async function processFrame() {
      if (!video.videoWidth) return;
      snapBtn.disabled = true;
      snapBtn.innerText = "পড়ছে...";
      statusBox.style.borderLeftColor = "#38bdf8";
      statusBox.innerText = "🔍 আইডি শনাক্ত করা হচ্ছে...";

      const w = video.videoWidth;
      const h = video.videoHeight;
      const cropW = Math.floor(w * 0.9);
      const cropH = Math.floor(h * 0.4);
      const cropX = Math.floor((w - cropW) / 2);
      const cropY = Math.floor((h - cropH) / 2);

      canvas.width = cropW;
      canvas.height = cropH;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, cropX, cropY, cropW, cropH, 0, 0, cropW, cropH);

      // ১. প্রথমে দ্রুত বারকোড চেষ্টা
      try {
        const barcodeResult = await codeReader.decodeFromCanvas(canvas);
        if (barcodeResult) {
          let bText = barcodeResult.getText().trim();
          for (let p of patterns) {
            let m = bText.match(p.regex);
            if (m) {
              addOrderId(m[0], p.name);
              finishSnap();
              return;
            }
          }
          addOrderId(bText, "Barcode");
          finishSnap();
          return;
        }
      } catch (e) {}

      // ২. বারকোড না পেলে স্পষ্ট OCR টেক্সট রিড
      try {
        // কনট্রাস্ট বাড়িয়ে লেখা পরিষ্কার করা
        let imgData = ctx.getImageData(0, 0, cropW, cropH);
        let d = imgData.data;
        for (let i = 0; i < d.length; i += 4) {
          let v = (d[i] * 0.299 + d[i+1] * 0.587 + d[i+2] * 0.114);
          v = v > 120 ? 255 : 0; // সাদা-কালো ফিল্টার
          d[i] = d[i+1] = d[i+2] = v;
        }
        ctx.putImageData(imgData, 0, 0);

        const ret = await worker.recognize(canvas);
        const text = ret.data.text.replace(/\s+/g, ' ');

        let matched = false;
        for (let p of patterns) {
          let match = text.match(p.regex);
          if (match) {
            addOrderId(match[0], p.name);
            matched = true;
            break;
          }
        }

        if (!matched) {
          statusBox.style.borderLeftColor = "#ef4444";
          statusBox.innerHTML = "❌ আইডি বোঝা যায়নি! ক্যামেরা একটু দূরে রেখে লেখা পরিষ্কার রাখুন।";
        }
      } catch (err) {
        statusBox.innerText = "সমস্যা হয়েছে, আবার চেষ্টা করুন।";
      }

      finishSnap();
    }

    function finishSnap() {
      snapBtn.disabled = false;
      snapBtn.innerText = "📸 স্ক্যান করুন";
    }

    function exportExcel() {
      if (!scannedData.length) return alert("কোনো ডাটা নেই!");
      let csv = "Serial,Platform,Order ID,Date,Time\n";
      scannedData.forEach((r, i) => csv += `${i + 1},"${r.platform}","${r.id}",${r.date},${r.time}\n`);
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = `Orders_${new Date().toISOString().slice(0,10)}.csv`;
      link.click();
    }

    function clearData() {
      if (confirm("সব ক্লিয়ার করবেন?")) {
        scannedData = [];
        updateUI();
        statusBox.innerText = "তালিকা খালি করা হয়েছে।";
      }
    }

    window.onload = initCamera;
  </script>
</body>
</html>
