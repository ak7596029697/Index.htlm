<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shipping Label PDF to Excel Extractor</title>
  <!-- PDF.js Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
  <!-- ZXing Barcode Scanner Engine -->
  <script src="https://unpkg.com/@zxing/library@latest"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: #0f172a; color: #f8fafc; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    .container { width: 100%; max-width: 950px; background: #1e293b; border-radius: 12px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
    h1 { font-size: 20px; color: #38bdf8; text-align: center; margin-bottom: 6px; }
    p.subtitle { font-size: 13px; color: #94a3b8; text-align: center; margin-bottom: 20px; }
    .upload-box { border: 2px dashed #38bdf8; border-radius: 8px; padding: 30px 15px; text-align: center; cursor: pointer; background: rgba(56, 189, 248, 0.05); }
    .upload-box:hover { background: rgba(56, 189, 248, 0.1); }
    input[type="file"] { display: none; }
    .upload-icon { font-size: 40px; margin-bottom: 10px; }
    .status-bar { margin-top: 15px; font-size: 14px; text-align: center; font-weight: bold; color: #38bdf8; min-height: 20px; }
    .controls { display: flex; gap: 10px; margin-top: 20px; }
    button { flex: 1; padding: 12px; font-size: 14px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; }
    .btn-export { background: #10b981; color: white; display: none; }
    .btn-clear { background: #ef4444; color: white; display: none; flex: 0 0 60px; }
    .results { margin-top: 20px; max-height: 420px; overflow-y: auto; background: #0f172a; border-radius: 8px; border: 1px solid #334155; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; text-align: left; }
    th, td { padding: 10px; border-bottom: 1px solid #334155; }
    th { background: #1e293b; color: #94a3b8; position: sticky; top: 0; }
    td { font-family: monospace; }
    .badge-unique { background: rgba(16, 185, 129, 0.2); color: #34d399; padding: 3px 8px; border-radius: 4px; font-weight: bold; font-family: sans-serif; }
    .badge-duplicate { background: rgba(239, 68, 68, 0.2); color: #f87171; padding: 3px 8px; border-radius: 4px; font-weight: bold; font-family: sans-serif; }
  </style>
</head>
<body>

  <div class="container">
    <h1>📄 Label PDF to Excel Extractor (Barcode Enabled)</h1>
    <p class="subtitle">Flipkart, Amazon ও Meesho শিপিং লেবেল থেকে বারকোড ও অর্ডার রিডার</p>

    <label class="upload-box" for="pdfInput">
      <div class="upload-icon">📦</div>
      <div style="font-size: 15px; font-weight: bold;">শিপিং লেবেল PDF ফাইলটি বেছে নিন</div>
      <div style="font-size: 12px; color: #94a3b8; margin-top: 4px;">(লেবেলের বারকোড স্ক্যান করে সঠিক AWB নম্বর বের করা হবে)</div>
      <input type="file" id="pdfInput" accept="application/pdf" onchange="processPDF(this)">
    </label>

    <div class="status-bar" id="statusBox"></div>

    <div class="controls">
      <button class="btn-export" id="exportBtn" onclick="exportToCSV()">📥 Excel (CSV) ডাউনলোড</button>
      <button class="btn-clear" id="clearBtn" onclick="clearData()">🗑️</button>
    </div>

    <div class="results" id="resultsBox" style="display:none;">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>স্ট্যাটাস</th>
            <th>প্ল্যাটফর্ম</th>
            <th>কুরিয়ার পার্টনার</th>
            <th>অর্ডার আইডি</th>
            <th>ট্র্যাকিং আইডি (AWB)</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>

  <canvas id="renderCanvas" style="display:none;"></canvas>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';

    let extractedData = [];
    const codeReader = new ZXing.BrowserMultiFormatReader();

    // প্ল্যাটফর্ম ও অর্ডার আইডি প্যাটার্ন
    const flipkartOrderRegex = /\bOD\d{16,20}\b/i;
    const amazonOrderRegex   = /\b\d{3}-\d{7}-\d{7}\b/;
    const meeshoOrderRegex   = /\b\d{16,20}_\d+\b/;

    // কুরিয়ার কোম্পানির নাম শনাক্তকরণ
    function getCourierPartner(text) {
      if (/Delhivery/i.test(text)) return "Delhivery";
      if (/Xpressbees|Xpress\s*bees|\bXB\b/i.test(text)) return "Xpressbees";
      if (/Shadowfax|\bSF\b/i.test(text)) return "Shadowfax";
      if (/Ekart|eKart/i.test(text)) return "Ekart";
      if (/Ecom\s*Express/i.test(text)) return "Ecom Express";
      if (/Amazon\s*Shipping|ATS/i.test(text)) return "Amazon Shipping";
      if (/DTDC/i.test(text)) return "DTDC";
      if (/Bluedart|Blue\s*Dart/i.test(text)) return "Blue Dart";
      return "অন্যান্য";
    }

    // PDF পেজের ছবি রেন্ডার করে বারকোড রিড করার ফাংশন
    async function scanBarcodeFromPage(page) {
      try {
        const viewport = page.getViewport({ scale: 2.0 });
        const canvas = document.getElementById('renderCanvas');
        const ctx = canvas.getContext('2d');
        canvas.height = viewport.height;
        canvas.width = viewport.width;

        await page.render({ canvasContext: ctx, viewport: viewport }).promise;
        const result = await codeReader.decodeFromCanvas(canvas);
        if (result && result.text) {
          return result.text.trim();
        }
      } catch (e) {
        // বারকোড রিড না হলে টেক্সট ব্যাকআপ চলবে
      }
      return null;
    }

    // টেক্সট থেকে ট্র্যাকিং নম্বর খোঁজার ব্যাকআপ নিয়ম
    function extractTrackingFromText(text, orderId) {
      const awbMatch = text.match(/(?:AWB|TRACKING|WAYBILL|AIRWAY)[:\s#-]*([A-Z0-9]{8,22})/i);
      if (awbMatch && awbMatch[1] && awbMatch[1] !== orderId) {
        return awbMatch[1].trim();
      }

      // দিল্লিভারি বা অন্যান্য কুরিয়ারের ১০-১৬ ডিজিটের নম্বর
      const allNumbers = text.match(/\b[0-9]{10,16}\b/g) || [];
      for (let num of allNumbers) {
        let clean = num.trim();
        if (clean !== orderId && !clean.startsWith("19") && !clean.startsWith("202")) {
          return clean;
        }
      }

      const specificPatterns = [
        /\b(FMPC[A-Z0-9]+)\b/i,
        /\b(FMPP[A-Z0-9]+)\b/i,
        /\b(SF\d{9,16})\b/i
      ];
      for (let reg of specificPatterns) {
        let m = text.match(reg);
        if (m && m[0] !== orderId) return m[0].trim();
      }

      return "নেই";
    }

    async function processPDF(input) {
      const file = input.files[0];
      if (!file) return;

      extractedData = [];
      const seenOrderIds = new Set();
      let duplicateCount = 0;

      const statusBox = document.getElementById('statusBox');
      const exportBtn = document.getElementById('exportBtn');
      const clearBtn = document.getElementById('clearBtn');
      const resultsBox = document.getElementById('resultsBox');
      const tableBody = document.getElementById('tableBody');

      tableBody.innerHTML = '';
      resultsBox.style.display = 'none';
      exportBtn.style.display = 'none';
      clearBtn.style.display = 'none';
      statusBox.innerHTML = "⏳ PDF ও বারকোড প্রসেস হচ্ছে...";

      try {
        const arrayBuffer = await file.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
        const totalPages = pdf.numPages;

        for (let pageNum = 1; pageNum <= totalPages; pageNum++) {
          statusBox.innerHTML = `⏳ পেজ ও বারকোড স্ক্যান হচ্ছে: ${pageNum} / ${totalPages}`;
          const page = await pdf.getPage(pageNum);
          const textContent = await page.getTextContent();
          const pageText = textContent.items.map(item => item.str).join(' ');

          let platform = "অন্যান্য";
          let orderId = "";

          // ১. প্ল্যাটফর্ম ও অর্ডার আইডি নির্ধারণ
          if (flipkartOrderRegex.test(pageText)) {
            platform = "Flipkart";
            orderId = pageText.match(flipkartOrderRegex)[0];
          } else if (amazonOrderRegex.test(pageText)) {
            platform = "Amazon";
            orderId = pageText.match(amazonOrderRegex)[0];
          } else if (meeshoOrderRegex.test(pageText)) {
            platform = "Meesho";
            orderId = pageText.match(meeshoOrderRegex)[0];
          }

          let courier = getCourierPartner(pageText);

          // ২. প্রথমে সরাসরি লেবেলের ছবি থেকে বারকোড স্ক্যান
          let trackingId = await scanBarcodeFromPage(page);

          // যদি বারকোড স্ক্যান কোনো কারণে না হয়, তবে টেক্সট থেকে খোঁজা
          if (!trackingId || trackingId === orderId) {
            trackingId = extractTrackingFromText(pageText, orderId);
          }

          if (orderId) {
            let isDuplicate = seenOrderIds.has(orderId);
            if (isDuplicate) {
              duplicateCount++;
            } else {
              seenOrderIds.add(orderId);
            }

            extractedData.push({
              platform: platform,
              courier: courier,
              orderId: orderId,
              trackingId: trackingId || "নেই",
              status: isDuplicate ? "Duplicate" : "Unique",
              page: pageNum
            });
          }
        }

        let summaryText = `✅ মোট <b>${extractedData.length}</b> টি পার্সেল সম্পন্ন!`;
        if (duplicateCount > 0) {
          summaryText += ` (⚠️ <b>${duplicateCount}</b> টি ডুপ্লিকেট শনাক্ত)`;
        }
        statusBox.innerHTML = summaryText;
        renderTable();
      } catch (err) {
        statusBox.innerHTML = "❌ ফাইল পড়তে সমস্যা হয়েছে! সঠিক শিপিং লেবেল PDF দিন।";
      }
    }

    function renderTable() {
      const tableBody = document.getElementById('tableBody');
      tableBody.innerHTML = '';
      extractedData.forEach((row, i) => {
        const tr = document.createElement('tr');
        const badgeClass = row.status === 'Duplicate' ? 'badge-duplicate' : 'badge-unique';
        const badgeText = row.status === 'Duplicate' ? 'ডুপ্লিকেট' : 'নতুন';

        tr.innerHTML = `
          <td>${i + 1}</td>
          <td><span class="${badgeClass}">${badgeText}</span></td>
          <td><b>${row.platform}</b></td>
          <td><span style="color:#38bdf8;">${row.courier}</span></td>
          <td>${row.orderId}</td>
          <td>${row.trackingId}</td>
        `;
        tableBody.appendChild(tr);
      });
      document.getElementById('resultsBox').style.display = 'block';
      document.getElementById('exportBtn').style.display = 'block';
      document.getElementById('clearBtn').style.display = 'block';
    }

    function exportToCSV() {
      if (!extractedData.length) return;
      let csv = "Serial,Status,Platform,Courier Partner,Order ID,Tracking ID\n";
      extractedData.forEach((r, i) => {
        csv += `${i + 1},"${r.status}","${r.platform}","${r.courier}","${r.orderId}","${r.trackingId}"\n`;
      });
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = `Orders_List_${new Date().toISOString().slice(0,10)}.csv`;
      link.click();
    }

    function clearData() {
      extractedData = [];
      document.getElementById('tableBody').innerHTML = '';
      document.getElementById('resultsBox').style.display = 'none';
      document.getElementById('exportBtn').style.display = 'none';
      document.getElementById('clearBtn').style.display = 'none';
      document.getElementById('statusBox').innerHTML = 'ক্লিয়ার করা হয়েছে।';
      document.getElementById('pdfInput').value = '';
    }
  </script>
</body>
</html>
