<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bulk Shipping & Return Order Manager</title>
  <!-- PDF.js & ZXing Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
  <script src="https://unpkg.com/@zxing/library@latest"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: #0f172a; color: #f8fafc; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    .container { width: 100%; max-width: 1050px; background: #1e293b; border-radius: 12px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
    h1 { font-size: 20px; color: #38bdf8; text-align: center; margin-bottom: 6px; }
    p.subtitle { font-size: 13px; color: #94a3b8; text-align: center; margin-bottom: 20px; }
    
    .grid-sections { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    @media (max-width: 700px) { .grid-sections { grid-template-columns: 1fr; } }

    .card { background: #0f172a; border-radius: 8px; padding: 15px; border: 1px solid #334155; }
    .card-title { font-size: 14px; font-weight: bold; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
    .card-dispatch { border-color: #38bdf8; }
    .card-return { border-color: #f59e0b; }

    .upload-box { border: 2px dashed #475569; border-radius: 6px; padding: 15px; text-align: center; cursor: pointer; background: rgba(255,255,255,0.02); display: block; }
    .upload-box:hover { border-color: #38bdf8; background: rgba(56, 189, 248, 0.05); }
    input[type="file"] { display: none; }

    .return-input-group { display: flex; gap: 8px; margin-top: 10px; }
    .return-input-group input { flex: 1; padding: 8px 12px; border-radius: 6px; border: 1px solid #475569; background: #1e293b; color: white; font-family: monospace; font-size: 13px; }
    .return-input-group button { padding: 8px 14px; border-radius: 6px; border: none; background: #f59e0b; color: #000; font-weight: bold; cursor: pointer; }

    .status-bar { margin-top: 15px; font-size: 14px; text-align: center; font-weight: bold; color: #38bdf8; min-height: 20px; }
    .controls { display: flex; gap: 10px; margin-top: 15px; flex-wrap: wrap; }
    button.action-btn { padding: 10px 14px; font-size: 13px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; }
    .btn-export { background: #10b981; color: white; display: none; flex: 2; }
    .btn-remove-dup { background: #64748b; color: white; display: none; flex: 1.5; }
    .btn-clear { background: #ef4444; color: white; display: none; width: 45px; }

    .results { margin-top: 20px; max-height: 480px; overflow-y: auto; background: #0f172a; border-radius: 8px; border: 1px solid #334155; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; text-align: left; }
    th, td { padding: 10px 8px; border-bottom: 1px solid #334155; }
    th { background: #1e293b; color: #94a3b8; position: sticky; top: 0; }
    td { font-family: monospace; }
    
    .badge-unique { background: rgba(16, 185, 129, 0.2); color: #34d399; padding: 3px 8px; border-radius: 4px; font-weight: bold; font-family: sans-serif; }
    .badge-duplicate { background: rgba(239, 68, 68, 0.2); color: #f87171; padding: 3px 8px; border-radius: 4px; font-weight: bold; font-family: sans-serif; }
    .badge-returned { background: #f59e0b; color: #000; padding: 3px 8px; border-radius: 4px; font-weight: bold; font-family: sans-serif; }
    .row-returned { background: rgba(245, 158, 11, 0.12) !important; border-left: 4px solid #f59e0b; }

    .btn-del-row { background: transparent; border: none; color: #ef4444; cursor: pointer; font-size: 14px; padding: 2px 6px; }
    .btn-del-row:hover { background: rgba(239, 68, 68, 0.2); border-radius: 4px; }
  </style>
</head>
<body>

  <div class="container">
    <h1>📄 Dispatch & Return Order Manager</h1>
    <p class="subtitle">Amazon, Flipkart ও Meesho শিপিং লেবেল ও রিটার্ন ট্র্যাকার</p>

    <div class="grid-sections">
      <div class="card card-dispatch">
        <div class="card-title" style="color: #38bdf8;">📦 ডিসপ্যাচ অর্ডার (শিপিং লেবেল)</div>
        <label class="upload-box" for="pdfInput">
          <div style="font-size: 24px;">📑</div>
          <div style="font-size: 13px; font-weight: bold; margin-top: 4px;">শিপিং লেবেল PDF বেছে নিন</div>
          <div style="font-size: 11px; color: #94a3b8;">(Amazon, Flipkart, Meesho এক বা একাধিক ফাইল)</div>
          <input type="file" id="pdfInput" accept="application/pdf" multiple onchange="processMultiplePDFs(this)">
        </label>
        <div style="margin-top: 8px; text-align: center;">
          <label style="font-size: 11px; color: #38bdf8; text-decoration: underline; cursor: pointer;">
            আগের সেভ করা CSV ফাইল আপলোড করুন
            <input type="file" accept=".csv" onchange="importExistingCSV(this)">
          </label>
        </div>
      </div>

      <div class="card card-return">
        <div class="card-title" style="color: #f59e0b;">🔄 রিটার্ন পার্সেল এন্ট্রি</div>
        <label class="upload-box" for="returnPdfInput" style="border-color: #f59e0b; background: rgba(245, 158, 11, 0.04);">
          <div style="font-size: 24px;">📥</div>
          <div style="font-size: 13px; font-weight: bold; margin-top: 4px;">রিটার্ন স্লিপের PDF দিন</div>
          <div style="font-size: 11px; color: #f59e0b;">(Amazon বা অন্য প্ল্যাটফর্মের রিটার্ন ফাইল)</div>
          <input type="file" id="returnPdfInput" accept="application/pdf" multiple onchange="processReturnPDFs(this)">
        </label>
        <div class="return-input-group">
          <input type="text" id="manualReturnId" placeholder="রিটার্ন Order বা Tracking ID লিখুন...">
          <button onclick="handleManualReturn()">রিটার্ন মার্ক করুন</button>
        </div>
      </div>
    </div>

    <div class="status-bar" id="statusBox"></div>

    <div class="controls">
      <button class="action-btn btn-export" id="exportBtn" onclick="exportToCSV()">📥 সব অর্ডারের Excel (CSV) ডাউনলোড</button>
      <button class="action-btn btn-remove-dup" id="removeDupBtn" onclick="removeOnlyDuplicates()">🧹 ডুপ্লিকেট মুছুন</button>
      <button class="action-btn btn-clear" id="clearBtn" onclick="clearData()" title="সব মুছুন">🗑️</button>
    </div>

    <div class="results" id="resultsBox" style="display:none;">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>স্ট্যাটাস</th>
            <th>তারিখ</th>
            <th>প্ল্যাটফর্ম</th>
            <th>কুরিয়ার পার্টনার</th>
            <th>অর্ডার আইডি</th>
            <th>ট্র্যাকিং আইডি (AWB)</th>
            <th style="text-align:center;">অ্যাকশন</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>

  <canvas id="hiddenCanvas" style="display:none;"></canvas>
  <canvas id="cropCanvas" style="display:none;"></canvas>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';

    let extractedData = [];

    // ZXing বারকোড রিডার
    const hints = new Map();
    hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
    const codeReader = new ZXing.BrowserMultiFormatReader(hints);

    const flipkartOrderRegex = /\bOD\d{16,20}\b/i;
    const amazonOrderRegex   = /\b\d{3}-\d{7}-\d{7}\b/;
    const meeshoOrderRegex   = /\b\d{16,20}_\d+\b/;

    function extractDate(text) {
      const dMatch = text.match(/\b(\d{1,2}[\/\.-]\d{1,2}[\/\.-]\d{2,4})\b/);
      if (dMatch) return dMatch[1];
      return new Date().toISOString().slice(0,10);
    }

    // Amazon লেবেলের উপরের বারকোডটি আলাদা ক্রপ করে রিড করার ফাংশন
    async function scanAmazonBarcodeFromPage(page) {
      try {
        const viewport = page.getViewport({ scale: 2.0 });
        const canvas = document.getElementById('hiddenCanvas');
        const ctx = canvas.getContext('2d');
        canvas.height = viewport.height;
        canvas.width = viewport.width;

        await page.render({ canvasContext: ctx, viewport: viewport }).promise;

        // ১. শুধু উপরের বামদিকের বারকোড অংশটুকু ক্রপ (নিচের QR কোড এড়িয়ে)
        const cropCanvas = document.getElementById('cropCanvas');
        cropCanvas.width = canvas.width * 0.70;
        cropCanvas.height = canvas.height * 0.35;
        const cropCtx = cropCanvas.getContext('2d');
        cropCtx.drawImage(canvas, 0, 0, cropCanvas.width, cropCanvas.height, 0, 0, cropCanvas.width, cropCanvas.height);

        try {
          const res1 = await codeReader.decodeFromCanvas(cropCanvas);
          if (res1 && res1.text) return res1.text.trim();
        } catch(e) {}

        // ২. ব্যাকআপ হিসেবে পুরো পেজ স্ক্যান
        try {
          const res2 = await codeReader.decodeFromCanvas(canvas);
          if (res2 && res2.text) return res2.text.trim();
        } catch(e) {}

      } catch (err) {
        console.error("Barcode decode error:", err);
      }
      return null;
    }

    function detectCourier(text, trackingId, platform) {
      if (platform === "Amazon" || /ATSPL|ATS|Amazon\s*Shipping/i.test(text)) return "Amazon Shipping (ATS)";
      if (/Delhivery/i.test(text)) return "Delhivery";
      if (/Xpressbees|Xpress\s*bees|\bXB\b/i.test(text)) return "Xpressbees";
      if (/Shadowfax|\bSF\b/i.test(text)) return "Shadowfax";
      if (/Ekart|eKart/i.test(text)) return "Ekart";
      if (/Ecom\s*Express/i.test(text)) return "Ecom Express";

      if (trackingId.startsWith("1340") || (trackingId.startsWith("14") && trackingId.length >= 14)) return "Xpressbees";
      if (trackingId.startsWith("SF") || trackingId.startsWith("sf")) return "Shadowfax";
      if (trackingId.startsWith("FMPC") || trackingId.startsWith("FMPP")) return "Ekart";
      if (/^(12|13|14|33|37)\d{10,12}$/.test(trackingId)) {
        return platform === "Amazon" ? "Amazon Shipping (ATS)" : "Delhivery";
      }

      return "অন্যান্য";
    }

    function findTrackingNumber(text, rawOrderId, platform) {
      const pureOrderId = rawOrderId.replace(/_\d+$/, '');

      const amzAwbDirect = text.match(/\bAWB\s*([0-9]{10,16})\b/i);
      if (amzAwbDirect && amzAwbDirect[1]) return amzAwbDirect[1].trim();

      const cleanedSpacedText = text.replace(/(\d)\s+(\d)\s+(\d)\s+(\d)/g, '$1$2$3$4');

      const prefixMatch = cleanedSpacedText.match(/(?:AWB|TRACKING|WAYBILL|WBN|AIRWAY\s*BILL)[:\s#-]*([A-Z0-9]{10,22})/i);
      if (prefixMatch && prefixMatch[1] && !prefixMatch[1].includes(pureOrderId)) return prefixMatch[1].trim();

      const specialMatch = cleanedSpacedText.match(/\b(FMPC[A-Z0-9]+|FMPP[A-Z0-9]+|SF\d{9,16}|IN\d{8,14}|TBA\d{9,15})\b/i);
      if (specialMatch && specialMatch[0]) return specialMatch[0].trim();

      const allNumbers = cleanedSpacedText.match(/\b\d{12,16}\b/g) || [];
      for (let num of allNumbers) {
        let clean = num.trim();
        if (clean !== pureOrderId && !clean.startsWith("2026") && !clean.startsWith("2025") && !clean.startsWith("19")) return clean;
      }

      return "নেই";
    }

    function refreshDuplicateStatus() {
      const seen = new Set();
      let dupCount = 0;
      extractedData.forEach(item => {
        if (item.status === "Returned") return;
        if (seen.has(item.orderId)) {
          item.status = "Duplicate";
          dupCount++;
        } else {
          item.status = "Unique";
          seen.add(item.orderId);
        }
      });
      return dupCount;
    }

    async function processMultiplePDFs(input) {
      const files = input.files;
      if (!files || files.length === 0) return;

      const statusBox = document.getElementById('statusBox');
      statusBox.innerHTML = `⏳ মোট ${files.length} টি ফাইল প্রসেস করা হচ্ছে...`;

      for (let fileIndex = 0; fileIndex < files.length; fileIndex++) {
        const file = files[fileIndex];
        statusBox.innerHTML = `⏳ ফাইল (${fileIndex + 1}/${files.length}) প্রসেস হচ্ছে: <b>${file.name}</b>`;

        try {
          const arrayBuffer = await file.arrayBuffer();
          const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
          const totalPages = pdf.numPages;

          let pendingBarcode = "";

          for (let pageNum = 1; pageNum <= totalPages; pageNum++) {
            statusBox.innerHTML = `⏳ স্ক্যান হচ্ছে: পাতা ${pageNum} / ${totalPages}`;
            const page = await pdf.getPage(pageNum);
            const textContent = await page.getTextContent();
            const items = textContent.items.map(item => item.str.trim()).filter(s => s.length > 0);
            const pageText = items.join(' ');

            // ইমেজ পেজ হলে বারকোড স্ক্যান
            let scannedBarcode = await scanAmazonBarcodeFromPage(page);
            if (scannedBarcode) {
              pendingBarcode = scannedBarcode;
            }

            let platform = "অন্যান্য";
            let orderId = "";

            if (flipkartOrderRegex.test(pageText)) {
              platform = "Flipkart";
              orderId = pageText.match(flipkartOrderRegex)[0];
            } else if (amazonOrderRegex.test(pageText)) {
              platform = "Amazon";
              orderId = pageText.match(amazonOrderRegex)[0];
            } else if (meeshoOrderRegex.test(pageText)) {
              platform = "Meesho";
              orderId = pageText.match(meeshoOrderRegex)[0];
            }

            if (orderId) {
              let trackingId = findTrackingNumber(pageText, orderId, platform);
              
              if (trackingId === "নেই" && pendingBarcode) {
                trackingId = pendingBarcode;
              }

              let courier = detectCourier(pageText, trackingId, platform);
              let orderDate = extractDate(pageText);

              extractedData.push({
                date: orderDate,
                platform: platform,
                courier: courier,
                orderId: orderId,
                trackingId: trackingId,
                status: "Unique"
              });

              pendingBarcode = "";
            }
          }
        } catch (err) {
          console.error(err);
        }
      }

      const duplicateCount = refreshDuplicateStatus();
      updateUI(duplicateCount);
      input.value = '';
    }

    function handleManualReturn() {
      const input = document.getElementById('manualReturnId');
      const val = input.value.trim();
      if (!val) return;
      markAsReturned(val, "অন্যান্য");
      input.value = '';
    }

    // রিটার্ন চিহ্নিত করা (প্ল্যাটফর্ম শনাক্তকরণসহ)
    function markAsReturned(searchKey, detectedPlatform) {
      let found = false;
      extractedData.forEach(item => {
        if (item.orderId.toLowerCase() === searchKey.toLowerCase() || 
           (item.trackingId !== "নেই" && item.trackingId.toLowerCase() === searchKey.toLowerCase())) {
          item.status = "Returned";
          found = true;
        }
      });

      if (!found) {
        // অর্ডারের ফরম্যাট অনুযায়ী প্ল্যাটফর্ম ও কুরিয়ার নির্ধারণ
        let pForm = detectedPlatform || "অন্যান্য";
        let cName = "অন্যান্য";

        if (amazonOrderRegex.test(searchKey) || pForm === "Amazon") {
          pForm = "Amazon";
          cName = "Amazon Shipping (ATS)";
        } else if (flipkartOrderRegex.test(searchKey) || pForm === "Flipkart") {
          pForm = "Flipkart";
          cName = "Ekart";
        } else if (meeshoOrderRegex.test(searchKey) || pForm === "Meesho") {
          pForm = "Meesho";
          cName = "Delhivery / Xpressbees";
        }

        extractedData.unshift({
          date: new Date().toISOString().slice(0,10),
          platform: pForm,
          courier: cName,
          orderId: searchKey,
          trackingId: "নেই",
          status: "Returned"
        });
      }

      updateUI(refreshDuplicateStatus());
      document.getElementById('statusBox').innerHTML = `⚠️ <b>${searchKey}</b> রিটার্ন হিসেবে চিহ্নিত হয়েছে!`;
    }

    // রিটার্ন PDF প্রসেস
    async function processReturnPDFs(input) {
      const files = input.files;
      if (!files || files.length === 0) return;

      for (let file of files) {
        try {
          const arrayBuffer = await file.arrayBuffer();
          const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
          for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
            const page = await pdf.getPage(pageNum);
            const textContent = await page.getTextContent();
            const pageText = textContent.items.map(item => item.str.trim()).join(' ');

            let pForm = "অন্যান্য";
            let orderId = "";
            if (amazonOrderRegex.test(pageText)) {
              pForm = "Amazon";
              orderId = pageText.match(amazonOrderRegex)[0];
            } else if (flipkartOrderRegex.test(pageText)) {
              pForm = "Flipkart";
              orderId = pageText.match(flipkartOrderRegex)[0];
            } else if (meeshoOrderRegex.test(pageText)) {
              pForm = "Meesho";
              orderId = pageText.match(meeshoOrderRegex)[0];
            }

            let barcode = await scanAmazonBarcodeFromPage(page);
            let trackingId = barcode || findTrackingNumber(pageText, orderId || "0", pForm);

            if (orderId) {
              markAsReturned(orderId, pForm);
            } else if (trackingId !== "নেই") {
              markAsReturned(trackingId, pForm);
            }
          }
        } catch (e) {
          console.error(e);
        }
      }
      input.value = '';
    }

    function importExistingCSV(input) {
      const file = input.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        const lines = e.target.result.split('\n');
        for (let i = 1; i < lines.length; i++) {
          const line = lines[i].trim();
          if (!line) continue;
          const cols = line.split(',').map(s => s.replace(/^"|"$/g, ''));
          if (cols.length >= 7) {
            extractedData.push({
              status: cols[1],
              date: cols[2],
              platform: cols[3],
              courier: cols[4],
              orderId: cols[5],
              trackingId: cols[6]
            });
          }
        }
        updateUI(refreshDuplicateStatus());
        document.getElementById('statusBox').innerHTML = `📥 পূর্বের CSV সফলভাবে লোড হয়েছে!`;
      };
      reader.readAsText(file);
      input.value = '';
    }

    function removeOnlyDuplicates() {
      const initialCount = extractedData.length;
      extractedData = extractedData.filter(item => item.status !== "Duplicate");
      const removedCount = initialCount - extractedData.length;
      refreshDuplicateStatus();
      updateUI(0);
      document.getElementById('statusBox').innerHTML = `🧹 <b>${removedCount}</b> টি ডুপ্লিকেট মুছে ফেলা হয়েছে!`;
    }

    function deleteSingleRow(index) {
      extractedData.splice(index, 1);
      const dupCount = refreshDuplicateStatus();
      updateUI(dupCount);
    }

    function updateUI(duplicateCount) {
      const statusBox = document.getElementById('statusBox');
      let returnCount = extractedData.filter(d => d.status === "Returned").length;
      let summaryText = `✅ মোট আছে: <b>${extractedData.length}</b> টি অর্ডার।`;
      if (returnCount > 0) summaryText += ` (⚠️ রিটার্ন: <b style="color:#f59e0b;">${returnCount}</b> টি)`;
      if (duplicateCount > 0) summaryText += ` (⚠️ ডুপ্লিকেট: <b>${duplicateCount}</b> টি)`;
      statusBox.innerHTML = summaryText;
      renderTable();
    }

    function renderTable() {
      const tableBody = document.getElementById('tableBody');
      tableBody.innerHTML = '';
      let hasDuplicates = false;

      extractedData.forEach((row, i) => {
        if (row.status === 'Duplicate') hasDuplicates = true;
        const tr = document.createElement('tr');
        
        let badgeClass = 'badge-unique';
        let badgeText = 'ডেলিভারি/প্রসেসিং';

        if (row.status === 'Duplicate') {
          badgeClass = 'badge-duplicate';
          badgeText = 'ডুপ্লিকেট';
        } else if (row.status === 'Returned') {
          badgeClass = 'badge-returned';
          badgeText = '⚠️ রিটার্ন এসেছে';
          tr.className = 'row-returned';
        }

        tr.innerHTML = `
          <td>${i + 1}</td>
          <td><span class="${badgeClass}">${badgeText}</span></td>
          <td style="color:#94a3b8;">${row.date}</td>
          <td><b>${row.platform}</b></td>
          <td><span style="color:#38bdf8; font-weight:bold;">${row.courier}</span></td>
          <td>${row.orderId}</td>
          <td style="color:${row.trackingId === 'নেই' ? '#f87171' : '#34d399'}; font-weight:bold;">${row.trackingId}</td>
          <td style="text-align:center;">
            <button class="btn-del-row" onclick="deleteSingleRow(${i})" title="মুছুন">❌</button>
          </td>
        `;
        tableBody.appendChild(tr);
      });

      const show = extractedData.length > 0;
      document.getElementById('resultsBox').style.display = show ? 'block' : 'none';
      document.getElementById('exportBtn').style.display = show ? 'block' : 'none';
      document.getElementById('clearBtn').style.display = show ? 'block' : 'none';
      document.getElementById('removeDupBtn').style.display = (show && hasDuplicates) ? 'block' : 'none';
    }

    function exportToCSV() {
      if (!extractedData.length) return;
      let csv = "Serial,Status,Date,Platform,Courier Partner,Order ID,Tracking ID\n";
      extractedData.forEach((r, i) => {
        csv += `${i + 1},"${r.status}","${r.date}","${r.platform}","${r.courier}","${r.orderId}","${r.trackingId}"\n`;
      });
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = `Orders_Report_${new Date().toISOString().slice(0,10)}.csv`;
      link.click();
    }

    function clearData() {
      extractedData = [];
      document.getElementById('tableBody').innerHTML = '';
      document.getElementById('resultsBox').style.display = 'none';
      document.getElementById('exportBtn').style.display = 'none';
      document.getElementById('removeDupBtn').style.display = 'none';
      document.getElementById('clearBtn').style.display = 'none';
      document.getElementById('statusBox').innerHTML = 'সব তথ্য মুছে ফেলা হয়েছে।';
      document.getElementById('pdfInput').value = '';
    }
  </script>
</body>
</html>
