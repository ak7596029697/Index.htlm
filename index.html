<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shipping Label PDF to Excel Extractor</title>
  <!-- PDF.js Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: #0f172a; color: #f8fafc; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    .container { width: 100%; max-width: 650px; background: #1e293b; border-radius: 12px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
    h1 { font-size: 20px; color: #38bdf8; text-align: center; margin-bottom: 6px; }
    p.subtitle { font-size: 13px; color: #94a3b8; text-align: center; margin-bottom: 20px; }
    .upload-box { border: 2px dashed #38bdf8; border-radius: 8px; padding: 30px 15px; text-align: center; cursor: pointer; background: rgba(56, 189, 248, 0.05); }
    .upload-box:hover { background: rgba(56, 189, 248, 0.1); }
    input[type="file"] { display: none; }
    .upload-icon { font-size: 40px; margin-bottom: 10px; }
    .status-bar { margin-top: 15px; font-size: 14px; text-align: center; font-weight: bold; color: #38bdf8; min-height: 20px; }
    .controls { display: flex; gap: 10px; margin-top: 20px; }
    button { flex: 1; padding: 12px; font-size: 14px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; }
    .btn-export { background: #10b981; color: white; display: none; }
    .btn-clear { background: #ef4444; color: white; display: none; flex: 0 0 60px; }
    .results { margin-top: 20px; max-height: 300px; overflow-y: auto; background: #0f172a; border-radius: 8px; border: 1px solid #334155; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; text-align: left; }
    th, td { padding: 10px; border-bottom: 1px solid #334155; }
    th { background: #1e293b; color: #94a3b8; position: sticky; top: 0; }
    td { font-family: monospace; }
  </style>
</head>
<body>

  <div class="container">
    <h1>📄 Label PDF to Excel Extractor</h1>
    <p class="subtitle">Flipkart, Amazon ও Meesho শিপিং লেবেল PDF থেকে এক্সেল ফাইল</p>

    <label class="upload-box" for="pdfInput">
      <div class="upload-icon">📑</div>
      <div style="font-size: 15px; font-weight: bold;">শিপিং লেবেল PDF ফাইলটি বেছে নিন</div>
      <div style="font-size: 12px; color: #94a3b8; margin-top: 4px;">(১০০+ পেজ হলেও সেকেন্ডেই কাজ করবে)</div>
      <input type="file" id="pdfInput" accept="application/pdf" onchange="processPDF(this)">
    </label>

    <div class="status-bar" id="statusBox"></div>

    <div class="controls">
      <button class="btn-export" id="exportBtn" onclick="exportToCSV()">📥 Excel (CSV) ডাউনলোড</button>
      <button class="btn-clear" id="clearBtn" onclick="clearData()">🗑️</button>
    </div>

    <div class="results" id="resultsBox" style="display:none;">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>প্ল্যাটফর্ম</th>
            <th>অর্ডার আইডি</th>
            <th>ট্র্যাকিং আইডি (AWB)</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';

    let extractedData = [];

    // ফরম্যাট প্যাটার্ন
    const flipkartOrderRegex = /\bOD\d{16,20}\b/i;
    const amazonOrderRegex   = /\b\d{3}-\d{7}-\d{7}\b/;
    const meeshoOrderRegex   = /\b\d{16,20}_\d+\b/;

    // সাধারণ ট্র্যাকিং আইডি প্যাটার্ন
    const trackingPatterns = [
      /\bFMPC\w+\b/i,
      /\bFMPP\w+\b/i,
      /\bSF\d{9,}\b/i,
      /\b\d{12,14}\b/,
      /\bDELHIVERY\w*\b/i,
      /\bECOM\w*\b/i
    ];

    async function processPDF(input) {
      const file = input.files[0];
      if (!file) return;

      extractedData = [];
      const statusBox = document.getElementById('statusBox');
      const exportBtn = document.getElementById('exportBtn');
      const clearBtn = document.getElementById('clearBtn');
      const resultsBox = document.getElementById('resultsBox');
      const tableBody = document.getElementById('tableBody');

      tableBody.innerHTML = '';
      resultsBox.style.display = 'none';
      exportBtn.style.display = 'none';
      clearBtn.style.display = 'none';
      statusBox.innerHTML = "⏳ PDF পড়া শুরু হচ্ছে...";

      try {
        const arrayBuffer = await file.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
        const totalPages = pdf.numPages;

        for (let pageNum = 1; pageNum <= totalPages; pageNum++) {
          statusBox.innerHTML = `⏳ পেজ প্রসেস হচ্ছে: ${pageNum} / ${totalPages}`;
          const page = await pdf.getPage(pageNum);
          const textContent = await page.getTextContent();
          const pageText = textContent.items.map(item => item.str).join(' ');

          let platform = "অন্যান্য";
          let orderId = "";
          let trackingId = "";

          // ১. অর্ডার আইডি চেক
          if (flipkartOrderRegex.test(pageText)) {
            platform = "Flipkart";
            orderId = pageText.match(flipkartOrderRegex)[0];
          } else if (amazonOrderRegex.test(pageText)) {
            platform = "Amazon";
            orderId = pageText.match(amazonOrderRegex)[0];
          } else if (meeshoOrderRegex.test(pageText)) {
            platform = "Meesho";
            orderId = pageText.match(meeshoOrderRegex)[0];
          }

          // ২. ট্র্যাকিং আইডি (AWB) খোঁজা
          for (let reg of trackingPatterns) {
            let m = pageText.match(reg);
            if (m && m[0] !== orderId) {
              trackingId = m[0];
              break;
            }
          }

          // যদি অর্ডার আইডি পাওয়া যায়
          if (orderId) {
            if (!extractedData.some(d => d.orderId === orderId)) {
              extractedData.push({
                platform: platform,
                orderId: orderId,
                trackingId: trackingId || "নেই",
                page: pageNum
              });
            }
          }
        }

        statusBox.innerHTML = `✅ সফল! মোট <b>${extractedData.length}</b> টি অর্ডার পাওয়া গেছে।`;
        renderTable();
      } catch (err) {
        statusBox.innerHTML = "❌ PDF পড়তে সমস্যা হয়েছে! সঠিক ফাইল দিন।";
      }
    }

    function renderTable() {
      const tableBody = document.getElementById('tableBody');
      tableBody.innerHTML = '';
      extractedData.forEach((row, i) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${i + 1}</td><td><b>${row.platform}</b></td><td>${row.orderId}</td><td>${row.trackingId}</td>`;
        tableBody.appendChild(tr);
      });
      document.getElementById('resultsBox').style.display = 'block';
      document.getElementById('exportBtn').style.display = 'block';
      document.getElementById('clearBtn').style.display = 'block';
    }

    function exportToCSV() {
      if (!extractedData.length) return;
      let csv = "Serial,Platform,Order ID,Tracking ID\n";
      extractedData.forEach((r, i) => {
        csv += `${i + 1},"${r.platform}","${r.orderId}","${r.trackingId}"\n`;
      });
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = `Orders_List_${new Date().toISOString().slice(0,10)}.csv`;
      link.click();
    }

    function clearData() {
      extractedData = [];
      document.getElementById('tableBody').innerHTML = '';
      document.getElementById('resultsBox').style.display = 'none';
      document.getElementById('exportBtn').style.display = 'none';
      document.getElementById('clearBtn').style.display = 'none';
      document.getElementById('statusBox').innerHTML = 'ক্লিয়ার করা হয়েছে।';
      document.getElementById('pdfInput').value = '';
    }
  </script>
</body>
</html>
