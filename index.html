<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bulk Shipping & Return Order Manager</title>
  <!-- PDF.js, Tesseract OCR & Barcode Scanner Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: #0f172a; color: #f8fafc; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    .container { width: 100%; max-width: 1050px; background: #1e293b; border-radius: 12px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
    h1 { font-size: 20px; color: #38bdf8; text-align: center; margin-bottom: 6px; }
    p.subtitle { font-size: 13px; color: #94a3b8; text-align: center; margin-bottom: 20px; }
    
    .grid-sections { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    @media (max-width: 700px) { .grid-sections { grid-template-columns: 1fr; } }

    .card { background: #0f172a; border-radius: 8px; padding: 15px; border: 1px solid #334155; }
    .card-title { font-size: 14px; font-weight: bold; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
    .card-dispatch { border-color: #38bdf8; }
    .card-return { border-color: #ef4444; }

    .upload-box { border: 2px dashed #475569; border-radius: 6px; padding: 15px; text-align: center; cursor: pointer; background: rgba(255,255,255,0.02); display: block; }
    .upload-box:hover { border-color: #38bdf8; background: rgba(56, 189, 248, 0.05); }
    input[type="file"] { display: none; }

    .btn-cam-scan { width: 100%; margin-top: 10px; padding: 9px; border-radius: 6px; border: none; color: #ffffff; font-weight: bold; cursor: pointer; font-size: 13px; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .btn-scan-dispatch { background: #0284c7; }
    .btn-scan-dispatch:hover { background: #0369a1; }
    .btn-scan-return { background: #b91c1c; }
    .btn-scan-return:hover { background: #991b1b; }

    #scanner-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 9999; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
    #scanner-box { width: 100%; max-width: 400px; background: #1e293b; border-radius: 12px; padding: 16px; border: 1px solid #38bdf8; text-align: center; }
    #scanner-preview { width: 100%; max-height: 260px; border-radius: 8px; overflow: hidden; }

    .return-input-group { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
    .return-input-group input { flex: 2; min-width: 180px; padding: 8px 12px; border-radius: 6px; border: 1px solid #475569; background: #1e293b; color: white; font-family: monospace; font-size: 13px; }
    .btn-return-mark { padding: 8px 12px; border-radius: 6px; border: none; background: #ef4444; color: #ffffff; font-weight: bold; cursor: pointer; }
    .btn-return-unmark { padding: 8px 12px; border-radius: 6px; border: none; background: #475569; color: #ffffff; font-weight: bold; cursor: pointer; }
    .btn-return-unmark:hover { background: #64748b; }

    .status-bar { margin-top: 15px; font-size: 14px; text-align: center; font-weight: bold; color: #38bdf8; min-height: 26px; padding: 6px 10px; border-radius: 6px; background: rgba(15, 23, 42, 0.6); }
    .controls { display: flex; gap: 10px; margin-top: 15px; flex-wrap: wrap; }
    button.action-btn { padding: 10px 14px; font-size: 13px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; transition: 0.2s; }
    
    .btn-save { background: #3b82f6; color: white; display: none; flex: 1.5; }
    .btn-save:hover { background: #2563eb; }
    .btn-export { background: #10b981; color: white; display: none; flex: 2; }
    .btn-remove-dup { background: #64748b; color: white; display: none; flex: 1.5; }
    .btn-clear { background: #ef4444; color: white; display: none; width: 45px; }

    .search-container { margin-top: 18px; display: none; }
    .search-box { width: 100%; padding: 10px 14px; border-radius: 8px; border: 1px solid #38bdf8; background: #0f172a; color: white; font-size: 13px; font-family: monospace; outline: none; }
    .search-box:focus { box-shadow: 0 0 10px rgba(56, 189, 248, 0.4); }

    .results { margin-top: 12px; max-height: 480px; overflow-y: auto; background: #0f172a; border-radius: 8px; border: 1px solid #334155; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; text-align: left; }
    th, td { padding: 10px 8px; border-bottom: 1px solid #334155; }
    th { background: #1e293b; color: #94a3b8; position: sticky; top: 0; z-index: 10; }
    td { font-family: monospace; }
    
    .badge-unique { background: rgba(16, 185, 129, 0.2); color: #34d399; padding: 3px 8px; border-radius: 4px; font-weight: bold; font-family: sans-serif; cursor: pointer; }
    .badge-duplicate { background: rgba(239, 68, 68, 0.2); color: #f87171; padding: 3px 8px; border-radius: 4px; font-weight: bold; font-family: sans-serif; }
    
    .badge-returned { background: #ef4444; color: #ffffff; padding: 3px 8px; border-radius: 4px; font-weight: bold; font-family: sans-serif; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
    .badge-returned:hover { background: #dc2626; }
    .row-returned { background: rgba(239, 68, 68, 0.22) !important; border-left: 5px solid #ef4444; }
    .row-returned td { color: #fca5a5 !important; }

    .btn-del-row { background: transparent; border: none; color: #ef4444; cursor: pointer; font-size: 14px; padding: 2px 6px; }
    .btn-del-row:hover { background: rgba(239, 68, 68, 0.2); border-radius: 4px; }
    
    .track-link { color: #38bdf8; text-decoration: underline; font-weight: bold; cursor: pointer; }
    .track-link:hover { color: #7dd3fc; }
  </style>
</head>
<body>

  <div class="container">
    <h1>📄 Dispatch & Return Order Manager</h1>
    <p class="subtitle">Amazon, Flipkart ও Meesho শিপিং লেবেল ও মেমরি সেভ সিস্টেম</p>

    <div class="grid-sections">
      <!-- ডিসপ্যাচ কার্ড -->
      <div class="card card-dispatch">
        <div class="card-title" style="color: #38bdf8;">📦 ডিসপ্যাচ অর্ডার (শিপিং লেবেল)</div>
        <label class="upload-box" for="pdfInput">
          <div style="font-size: 24px;">📑</div>
          <div style="font-size: 13px; font-weight: bold; margin-top: 4px;">শিপিং লেবেল PDF বেছে নিন</div>
          <div style="font-size: 11px; color: #94a3b8;">(Amazon, Flipkart, Meesho এক বা একাধিক ফাইল)</div>
          <input type="file" id="pdfInput" accept="application/pdf" multiple onchange="processMultiplePDFs(this)">
        </label>
        <button class="btn-cam-scan btn-scan-dispatch" onclick="startScanner('dispatch')">📷 ক্যামেরা দিয়ে ডিসপ্যাচ বারকোড স্ক্যান</button>
      </div>

      <!-- রিটার্ন কার্ড -->
      <div class="card card-return">
        <div class="card-title" style="color: #ef4444;">🔄 রিটার্ন পার্সেল এন্ট্রি ও আন-মার্ক</div>
        <label class="upload-box" for="returnPdfInput" style="border-color: #ef4444; background: rgba(239, 68, 68, 0.04);">
          <div style="font-size: 24px;">📥</div>
          <div style="font-size: 13px; font-weight: bold; margin-top: 4px;">রিটার্ন স্লিপের PDF দিন</div>
          <div style="font-size: 11px; color: #ef4444;">(রিটার্ন স্লিপ ফাইল থাকলে)</div>
          <input type="file" id="returnPdfInput" accept="application/pdf" multiple onchange="processReturnPDFs(this)">
        </label>
        
        <button class="btn-cam-scan btn-scan-return" onclick="startScanner('return')">📷 ক্যামেরা দিয়ে রিটার্ন বারকোড স্ক্যান</button>

        <div class="return-input-group">
          <input type="text" id="manualReturnId" placeholder="Order ID বা Tracking ID লিখুন...">
          <button class="btn-return-mark" onclick="handleManualReturn()">রিটার্ন মার্ক</button>
          <button class="btn-return-unmark" onclick="handleManualUnreturn()" title="ভুল করে রিটার্ন হলে স্বাভাবিক অবস্থায় ফেরান">↩️ বাতিল</button>
        </div>
      </div>
    </div>

    <div class="status-bar" id="statusBox"></div>

    <div class="controls">
      <button class="action-btn btn-save" id="saveBtn" onclick="manualSaveToMemory()">💾 মেমরিতে সেভ করুন</button>
      <button class="action-btn btn-export" id="exportBtn" onclick="exportToCSV()">📤 Excel ফাইল সেভ ও শেয়ার (Drive / WhatsApp)</button>
      <button class="action-btn btn-remove-dup" id="removeDupBtn" onclick="removeOnlyDuplicates()">🧹 ডুপ্লিকেট মুছুন</button>
      <button class="action-btn btn-clear" id="clearBtn" onclick="clearData()" title="সব মুছুন">🗑️ সব মুছুন</button>
    </div>

    <div class="search-container" id="searchContainer">
      <input type="text" id="searchInput" class="search-box" placeholder="🔍 যে কোনো Order ID বা Tracking ID লিখে খুঁজুন..." oninput="handleSearch()">
    </div>

    <div class="results" id="resultsBox" style="display:none;">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>স্ট্যাটাস (ক্লিক করে বদলান)</th>
            <th>তারিখ</th>
            <th>প্ল্যাটফর্ম</th>
            <th>কুরিয়ার পার্টনার</th>
            <th>অর্ডার আইডি</th>
            <th>ট্র্যাকিং আইডি (AWB)</th>
            <th style="text-align:center;">অ্যাকশন</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>

  <div id="scanner-modal">
    <div id="scanner-box">
      <h3 id="scanner-title" style="color:#38bdf8; font-size:14px; margin-bottom:8px;">📷 বারকোড স্ক্যানার</h3>
      <div id="scanner-preview"></div>
      <button style="margin-top:10px; background:#475569; color:#fff; border:none; padding:8px 16px; border-radius:6px; font-weight:bold; cursor:pointer;" onclick="stopCameraScanner()">✕ বন্ধ করুন</button>
    </div>
  </div>

  <canvas id="hiddenCanvas" style="display:none;"></canvas>
  <canvas id="cropCanvas" style="display:none;"></canvas>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';

    let extractedData = JSON.parse(localStorage.getItem('my_orders_db') || '[]');
    let ocrWorker = null;
    let html5QrScanner = null;
    let currentScanMode = 'return';

    async function initOCR() {
      if (!ocrWorker) {
        ocrWorker = await Tesseract.createWorker('eng');
      }
      return ocrWorker;
    }

    const flipkartOrderRegex = /\bOD\d{16,20}\b/i;
    const amazonOrderRegex   = /\b\d{3}-\d{7}-\d{7}\b/;
    const meeshoOrderRegex   = /\b\d{16,20}_\d+\b/;

    function extractDate(text) {
      const dMatch = text.match(/\b(\d{1,2}[\/\.-]\d{1,2}[\/\.-]\d{2,4})\b/);
      if (dMatch) return dMatch[1];
      return new Date().toISOString().slice(0,10);
    }

    function getTrackingUrl(courier, trackingId) {
      if (!trackingId || trackingId === "নেই") return null;
      const cleanAwb = encodeURIComponent(trackingId.trim());

      if (courier.includes("Shadowfax") || cleanAwb.startsWith("SF")) {
        return `https://tracker.shadowfax.in/#/track/${cleanAwb}`;
      } else if (courier.includes("Delhivery")) {
        return `https://www.delhivery.com/track/package/${cleanAwb}`;
      } else if (courier.includes("Xpressbees")) {
        return `https://www.xpressbees.com/shipment/tracking?awb=${cleanAwb}`;
      } else if (courier.includes("Ekart")) {
        return `https://ekartlogistics.com/shipmenttrack/${cleanAwb}`;
      } else if (courier.includes("Amazon")) {
        return `https://track.amazon.in/tracking/${cleanAwb}`;
      } else if (courier.includes("Ecom Express")) {
        return `https://ecomexpress.in/tracking/?awb_number=${cleanAwb}`;
      }
      return `https://www.google.com/search?q=${cleanAwb}+tracking`;
    }

    async function extractAmazonAWBFromImage(page) {
      try {
        const viewport = page.getViewport({ scale: 2.0 });
        const canvas = document.getElementById('hiddenCanvas');
        const ctx = canvas.getContext('2d');
        canvas.height = viewport.height;
        canvas.width = viewport.width;

        await page.render({ canvasContext: ctx, viewport: viewport }).promise;

        const cropCanvas = document.getElementById('cropCanvas');
        cropCanvas.width = canvas.width * 0.55;
        cropCanvas.height = canvas.height * 0.22;
        const cropCtx = cropCanvas.getContext('2d');
        cropCtx.drawImage(canvas, 0, 0, cropCanvas.width, cropCanvas.height, 0, 0, cropCanvas.width, cropCanvas.height);

        const worker = await initOCR();
        const ret = await worker.recognize(cropCanvas);
        const ocrText = ret.data.text;

        const match = ocrText.match(/AWB\s*([0-9]{10,14})/i) || ocrText.match(/\b(37[0-9]{10})\b/);
        if (match && match[1]) {
          return match[1].trim();
        }
      } catch (err) {
        console.error("OCR Error:", err);
      }
      return null;
    }

    function detectCourier(text, trackingId, platform) {
      if (/Delhivery/i.test(text)) return "Delhivery";
      if (/Xpress\s*bees|Xpressbees|\bXB\b/i.test(text)) return "Xpressbees";
      if (/Shadowfax|dowfax/i.test(text) || trackingId.toUpperCase().startsWith("SF")) return "Shadowfax";
      if (platform === "Amazon" || /ATSPL|ATS|Amazon\s*Shipping/i.test(text)) return "Amazon Shipping (ATS)";
      if (/Ekart|eKart/i.test(text) || trackingId.startsWith("FMPC") || trackingId.startsWith("FMPP")) return "Ekart";
      if (/Ecom\s*Express/i.test(text)) return "Ecom Express";

      if (trackingId.startsWith("1340")) return "Xpressbees";
      if (/^(12|13|14|33|37)\d{10,14}$/.test(trackingId)) {
        return platform === "Amazon" ? "Amazon Shipping (ATS)" : "Delhivery";
      }

      return "অন্যান্য";
    }

    function findTrackingNumber(text, rawOrderId, platform) {
      const pureOrderId = rawOrderId.replace(/_\d+$/, '');

      const sfDirect = text.match(/\bSF\s*([0-9]{8,14}\s*[A-Z]{0,5})\b/i);
      if (sfDirect && sfDirect[1]) {
        return ("SF" + sfDirect[1].replace(/\s+/g, '')).toUpperCase();
      }

      const amzAwbDirect = text.match(/\bAWB\s*([0-9]{10,16})\b/i);
      if (amzAwbDirect && amzAwbDirect[1]) return amzAwbDirect[1].trim();

      const tagMatch = text.match(/(?:AWB|TRACKING|WAYBILL|WBN|AIRWAY\s*BILL)[:\s#-]*([A-Z0-9]{10,22})/i);
      if (tagMatch && tagMatch[1]) {
        let cleanTagVal = tagMatch[1].trim();
        if (!cleanTagVal.includes(pureOrderId)) return cleanTagVal;
      }

      const ekartMatch = text.match(/\b(FMPC[A-Z0-9]+|FMPP[A-Z0-9]+)\b/i);
      if (ekartMatch) return ekartMatch[0].trim();

      const allNumbers = text.match(/\b\d{12,16}\b/g) || [];
      for (let num of allNumbers) {
        let clean = num.trim();
        if (clean !== pureOrderId && !clean.startsWith("2026") && !clean.startsWith("2025") && !clean.startsWith("19") && !clean.startsWith("3329")) {
          return clean;
        }
      }

      const tenDigitNumbers = text.match(/\b\d{10,11}\b/g) || [];
      for (let num of tenDigitNumbers) {
        let clean = num.trim();
        if (clean !== pureOrderId && !clean.startsWith("91") && !clean.startsWith("202")) return clean;
      }

      return "নেই";
    }

    function refreshDuplicateStatus() {
      const seen = new Set();
      let dupCount = 0;
      extractedData.forEach(item => {
        if (item.status === "Returned") return;
        if (seen.has(item.orderId)) {
          item.status = "Duplicate";
          dupCount++;
        } else {
          item.status = "Unique";
          seen.add(item.orderId);
        }
      });
      return dupCount;
    }

    function autoSaveAndSync() {
      localStorage.setItem('my_orders_db', JSON.stringify(extractedData));
    }

    function manualSaveToMemory() {
      autoSaveAndSync();
      const statusBox = document.getElementById('statusBox');
      statusBox.innerHTML = `💾 <b>সফলভাবে ব্রাউজার মেমরিতে সেভ হয়েছে!</b> (মোট সংরক্ষিত: ${extractedData.length} টি)`;
      statusBox.style.color = '#10b981';
      setTimeout(() => { 
        statusBox.style.color = '#38bdf8'; 
        updateUI(refreshDuplicateStatus());
      }, 2500);
    }

    async function processMultiplePDFs(input) {
      const files = Array.from(input.files);
      if (!files || files.length === 0) return;

      const statusBox = document.getElementById('statusBox');
      statusBox.innerHTML = `⏳ মোট ${files.length} টি ফাইল প্রসেস করা হচ্ছে...`;

      let beforeCount = extractedData.length;

      for (let fileIndex = 0; fileIndex < files.length; fileIndex++) {
        const file = files[fileIndex];
        statusBox.innerHTML = `⏳ ফাইল (${fileIndex + 1}/${files.length}) প্রসেস হচ্ছে: <b>${file.name}</b>`;

        try {
          const arrayBuffer = await file.arrayBuffer();
          const pdf = await pdfjsLib.getDocument({ data: arrayBuffer, disableFontFace: true }).promise;
          const totalPages = pdf.numPages;

          let pendingAmazonAWB = "";

          for (let pageNum = 1; pageNum <= totalPages; pageNum++) {
            statusBox.innerHTML = `⏳ ফাইল (${fileIndex + 1}/${files.length}) - পাতা ${pageNum} / ${totalPages}`;
            const page = await pdf.getPage(pageNum);
            const textContent = await page.getTextContent();
            const items = textContent.items.map(item => item.str.trim()).filter(s => s.length > 0);
            const pageText = items.join(' ');

            if (pageText.length < 40) {
              try {
                let awb = await extractAmazonAWBFromImage(page);
                if (awb) pendingAmazonAWB = awb;
              } catch(e) {}
            }

            let platform = "অন্যান্য";
            let orderId = "";

            if (flipkartOrderRegex.test(pageText)) {
              platform = "Flipkart";
              orderId = pageText.match(flipkartOrderRegex)[0];
            } else if (amazonOrderRegex.test(pageText)) {
              platform = "Amazon";
              orderId = pageText.match(amazonOrderRegex)[0];
            } else if (meeshoOrderRegex.test(pageText)) {
              platform = "Meesho";
              orderId = pageText.match(meeshoOrderRegex)[0];
            }

            if (orderId) {
              let trackingId = findTrackingNumber(pageText, orderId, platform);
              
              if ((trackingId === "নেই" || platform === "Amazon") && pendingAmazonAWB) {
                trackingId = pendingAmazonAWB;
              }

              let courier = detectCourier(pageText, trackingId, platform);
              let orderDate = extractDate(pageText);

              extractedData.push({
                date: orderDate,
                platform: platform,
                courier: courier,
                orderId: orderId,
                trackingId: trackingId,
                status: "Unique"
              });

              pendingAmazonAWB = "";
            }
            page.cleanup();
          }
          pdf.destroy();
        } catch (err) {
          console.error(err);
        }
      }

      let addedCount = extractedData.length - beforeCount;
      const duplicateCount = refreshDuplicateStatus();
      autoSaveAndSync();
      updateUI(duplicateCount, addedCount);
      input.value = '';
    }

    async function processReturnPDFs(input) {
      const files = Array.from(input.files);
      if (!files || files.length === 0) return;

      const statusBox = document.getElementById('statusBox');
      statusBox.innerHTML = `⏳ রিটার্ন স্লিপ প্রসেস করা হচ্ছে...`;

      let markedCount = 0;

      for (let file of files) {
        try {
          const arrayBuffer = await file.arrayBuffer();
          const pdf = await pdfjsLib.getDocument({ data: arrayBuffer, disableFontFace: true }).promise;
          for (let p = 1; p <= pdf.numPages; p++) {
            const page = await pdf.getPage(p);
            const textContent = await page.getTextContent();
            const pageText = textContent.items.map(i => i.str).join(' ');

            extractedData.forEach(item => {
              if (pageText.includes(item.orderId) || (item.trackingId !== "নেই" && pageText.includes(item.trackingId))) {
                item.status = "Returned";
                markedCount++;
              }
            });
            page.cleanup();
          }
          pdf.destroy();
        } catch (e) {
          console.error(e);
        }
      }

      autoSaveAndSync();
      updateUI(refreshDuplicateStatus());
      statusBox.innerHTML = `✅ মোট <b>${markedCount}</b> টি পার্সেল রিটার্ন চিহ্নিত ও অটো-সেভ হয়েছে!`;
      input.value = '';
    }

    function handleManualReturn() {
      const input = document.getElementById('manualReturnId');
      const val = input.value.trim();
      if (!val) return;
      markAsReturned(val);
      input.value = '';
    }

    function handleManualUnreturn() {
      const input = document.getElementById('manualReturnId');
      const val = input.value.trim();
      if (!val) return;
      unmarkReturn(val);
      input.value = '';
    }

    function markAsReturned(searchKey) {
      let found = false;
      extractedData.forEach(item => {
        if (item.orderId.toLowerCase() === searchKey.toLowerCase() || 
           (item.trackingId !== "নেই" && item.trackingId.toLowerCase() === searchKey.toLowerCase())) {
          item.status = "Returned";
          found = true;
        }
      });

      if (!found) {
        let isOrder = amazonOrderRegex.test(searchKey) || flipkartOrderRegex.test(searchKey) || meeshoOrderRegex.test(searchKey);
        let pForm = "অন্যান্য";
        let cName = detectCourier("", searchKey, "অন্যান্য");

        if (amazonOrderRegex.test(searchKey)) {
          pForm = "Amazon";
          cName = "Amazon Shipping (ATS)";
        } else if (flipkartOrderRegex.test(searchKey)) {
          pForm = "Flipkart";
          cName = "Ekart";
        } else if (meeshoOrderRegex.test(searchKey)) {
          pForm = "Meesho";
        }

        extractedData.unshift({
          date: new Date().toISOString().slice(0,10),
          platform: pForm,
          courier: cName,
          orderId: isOrder ? searchKey : "স্ক্যান রিটার্ন",
          trackingId: isOrder ? "নেই" : searchKey,
          status: "Returned"
        });
      }

      autoSaveAndSync();
      updateUI(refreshDuplicateStatus());
      document.getElementById('statusBox').innerHTML = `🔄 <b>${searchKey}</b> লাল রঙে রিটার্ন চিহ্নিত ও অটো-সেভ হয়েছে!`;
    }

    function handleDispatchScan(scannedCode) {
      let existing = extractedData.find(item => item.trackingId.toLowerCase() === scannedCode.toLowerCase());
      if (existing) {
        alert(`⚠️ এই ট্র্যাকিং নম্বরটি (${scannedCode}) ইতিমধ্যে মেমরিতে আছে!`);
        return;
      }

      let courier = detectCourier("", scannedCode, "অন্যান্য");
      extractedData.unshift({
        date: new Date().toISOString().slice(0,10),
        platform: "বারকোড ডিসপ্যাচ",
        courier: courier,
        orderId: "স্ক্যান ডিসপ্যাচ",
        trackingId: scannedCode,
        status: "Unique"
      });

      autoSaveAndSync();
      updateUI(refreshDuplicateStatus(), 1);
      document.getElementById('statusBox').innerHTML = `📦 <b>${scannedCode}</b> নতুন ট্র্যাকিং আইডি হিসেবে ডিসপ্যাচে সেভ হয়েছে!`;
    }

    function unmarkReturn(searchKey) {
      let found = false;
      extractedData.forEach(item => {
        if (item.orderId.toLowerCase() === searchKey.toLowerCase() || 
           (item.trackingId !== "নেই" && item.trackingId.toLowerCase() === searchKey.toLowerCase())) {
          item.status = "Unique";
          found = true;
        }
      });

      if (found) {
        autoSaveAndSync();
        updateUI(refreshDuplicateStatus());
        document.getElementById('statusBox').innerHTML = `↩️ <b>${searchKey}</b> রিটার্ন বাতিল করে সাধারণ অবস্থায় ফেরানো হয়েছে!`;
      }
    }

    function startScanner(mode) {
      currentScanMode = mode;
      const modal = document.getElementById("scanner-modal");
      const title = document.getElementById("scanner-title");
      
      if (mode === 'dispatch') {
        title.innerHTML = "📦 ডিসপ্যাচ বারকোড স্ক্যান করুন";
        title.style.color = "#38bdf8";
      } else {
        title.innerHTML = "🔄 রিটার্ন বারকোড স্ক্যান করুন";
        title.style.color = "#ef4444";
      }

      modal.style.display = "flex";
      html5QrScanner = new Html5Qrcode("scanner-preview");

      html5QrScanner.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 250, height: 140 } },
        (decodedText) => {
          if (navigator.vibrate) navigator.vibrate(100);
          stopCameraScanner();
          const cleanCode = decodedText.trim();
          
          if (currentScanMode === 'dispatch') {
            handleDispatchScan(cleanCode);
          } else {
            markAsReturned(cleanCode);
          }
        },
        () => {}
      ).catch(() => {
        alert("ক্যামেরা অন করা যায়নি। ক্যামেরার পারমিশন দেওয়া আছে কি না নিশ্চিত করুন।");
        stopCameraScanner();
      });
    }

    function stopCameraScanner() {
      if (html5QrScanner) {
        html5QrScanner.stop().then(() => {
          html5QrScanner.clear();
          document.getElementById("scanner-modal").style.display = "none";
        }).catch(() => {
          document.getElementById("scanner-modal").style.display = "none";
        });
      } else {
        document.getElementById("scanner-modal").style.display = "none";
      }
    }

    function toggleRowStatus(index) {
      if (extractedData[index].status === "Returned") {
        extractedData[index].status = "Unique";
      } else {
        extractedData[index].status = "Returned";
      }
      autoSaveAndSync();
      updateUI(refreshDuplicateStatus());
    }

    function deleteRow(index) {
      extractedData.splice(index, 1);
      autoSaveAndSync();
      updateUI(refreshDuplicateStatus());
    }

    function removeOnlyDuplicates() {
      const seen = new Set();
      const uniqueList = [];
      let removedCount = 0;

      extractedData.forEach(item => {
        if (item.status === "Returned") {
          uniqueList.push(item);
        } else if (!seen.has(item.orderId)) {
          seen.add(item.orderId);
          uniqueList.push(item);
        } else {
          removedCount++;
        }
      });

      extractedData = uniqueList;
      autoSaveAndSync();
      updateUI(0);
      alert(`মোট ${removedCount} টি ডুপ্লিকেট অর্ডার মুছে ফেলা হয়েছে!`);
    }

    function clearData() {
      const sure = confirm("⚠️ সতর্কতা!\nআপনি কি নিশ্চিতভাবে সমস্ত সংরক্ষিত ডেটা সম্পূর্ণ মুছে ফেলতে চান?\nএকবার মুছে ফেললে এটি আর ফিরিয়ে আনা সম্ভব হবে না।");
      if (sure) {
        extractedData = [];
        localStorage.removeItem('my_orders_db');
        updateUI(0);
        document.getElementById('statusBox').innerHTML = `🗑️ সমস্ত ডেটা মুছে ফেলা হয়েছে।`;
      }
    }

    // নেটিভ গুগল ড্রাইভ, হোয়াটসঅ্যাপ ও জিমেইল শেয়ার শিট লজিক
    async function exportToCSV() {
      if (extractedData.length === 0) {
        alert("শেয়ার বা সেভ করার মতো কোনো ডেটা নেই!");
        return;
      }
      
      let csv = "\uFEFFতারিখ,প্ল্যাটফর্ম,কুরিয়ার পার্টনার,অর্ডার আইডি,ট্র্যাকিং আইডি,স্ট্যাটাস\n";
      extractedData.forEach(row => {
        csv += `"${row.date}","${row.platform}","${row.courier}","${row.orderId}","${row.trackingId}","${row.status}"\n`;
      });

      const fileName = `Orders_Report_${new Date().toISOString().slice(0,10)}.csv`;
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const file = new File([blob], fileName, { type: 'text/csv' });

      // অ্যান্ড্রয়েড নেটিভ শেয়ার শিট কল করা (Drive, WhatsApp, Gmail অপশন ওপেন হবে)
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try {
          await navigator.share({
            title: 'NXT Orders Excel Report',
            text: 'আজকের ডিসপ্যাচ ও রিটার্ন অর্ডারের আপডেটেড তালিকা।',
            files: [file]
          });
          return;
        } catch (err) {
          if (err.name === 'AbortError') return; // ইউজার নিজেই ব্যাক করলে কিছু হবে না
        }
      }

      // শেয়ার সাপোর্ট না করলে সাধারণ ডাউনলোড ব্যাকআপ
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = fileName;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function handleSearch() {
      const query = document.getElementById('searchInput').value.trim().toLowerCase();
      renderTable(query);
    }

    function renderTable(filterQuery = "") {
      const tableBody = document.getElementById('tableBody');
      tableBody.innerHTML = '';

      extractedData.forEach((item, index) => {
        if (filterQuery) {
          const matchOrder = item.orderId.toLowerCase().includes(filterQuery);
          const matchTrack = item.trackingId.toLowerCase().includes(filterQuery);
          if (!matchOrder && !matchTrack) return;
        }

        const tr = document.createElement('tr');
        if (item.status === "Returned") tr.className = 'row-returned';

        let badgeHtml = '';
        if (item.status === 'Returned') {
          badgeHtml = `<span class="badge-returned" onclick="toggleRowStatus(${index})" title="ক্লিক করে আনমার্ক করুন">🔴 RETURNED ↩️</span>`;
        } else if (item.status === 'Duplicate') {
          badgeHtml = `<span class="badge-duplicate">DUPLICATE</span>`;
        } else {
          badgeHtml = `<span class="badge-unique" onclick="toggleRowStatus(${index})" title="ক্লিক করে রিটার্ন মার্ক করুন">🟢 UNIQUE</span>`;
        }

        let trackingHtml = item.trackingId;
        const trackUrl = getTrackingUrl(item.courier, item.trackingId);
        if (trackUrl) {
          trackingHtml = `<a class="track-link" href="${trackUrl}" target="_blank">${item.trackingId} 🔗</a>`;
        }

        tr.innerHTML = `
          <td>${index + 1}</td>
          <td>${badgeHtml}</td>
          <td>${item.date}</td>
          <td><b>${item.platform}</b></td>
          <td>${item.courier}</td>
          <td style="font-weight:bold;">${item.orderId}</td>
          <td>${trackingHtml}</td>
          <td style="text-align:center;">
            <button class="btn-del-row" onclick="deleteRow(${index})" title="এই রো মুছুন">❌</button>
          </td>
        `;
        tableBody.appendChild(tr);
      });
    }

    function updateUI(duplicateCount = 0, addedCount = null) {
      const hasData = extractedData.length > 0;

      document.getElementById('saveBtn').style.display = hasData ? 'inline-block' : 'none';
      document.getElementById('exportBtn').style.display = hasData ? 'inline-block' : 'none';
      document.getElementById('removeDupBtn').style.display = (hasData && duplicateCount > 0) ? 'inline-block' : 'none';
      document.getElementById('clearBtn').style.display = hasData ? 'inline-block' : 'none';
      document.getElementById('searchContainer').style.display = hasData ? 'block' : 'none';
      document.getElementById('resultsBox').style.display = hasData ? 'block' : 'none';

      let returnedCount = extractedData.filter(i => i.status === "Returned").length;
      let uniqueCount = extractedData.length - duplicateCount - returnedCount;

      let statusMsg = `📊 মোট এন্ট্রি: <b>${extractedData.length}</b> টি | ইউনিক: <b>${uniqueCount}</b> টি | রিটার্ন: <b>${returnedCount}</b> টি | ডুপ্লিকেট: <b>${duplicateCount}</b> টি`;
      if (addedCount !== null) {
        statusMsg += ` | <span style="color:#10b981;">(নতুন যোগ হয়েছে: ${addedCount} টি)</span>`;
      }
      document.getElementById('statusBox').innerHTML = statusMsg;

      renderTable();
    }

    updateUI(refreshDuplicateStatus());
  </script>
</body>
</html>
