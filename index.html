<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Smart Order ID OCR Scanner</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: #0f172a; color: #f8fafc; padding: 12px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    .header { width: 100%; max-width: 480px; text-align: center; margin-bottom: 12px; }
    .header h1 { font-size: 20px; color: #38bdf8; }
    .camera-container { position: relative; width: 100%; max-width: 480px; border-radius: 12px; overflow: hidden; background: #000; }
    video { width: 100%; height: 260px; object-fit: cover; display: block; }
    .viewfinder { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 85%; height: 60px; border: 2px dashed #38bdf8; border-radius: 8px; background: rgba(56, 189, 248, 0.1); box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.5); pointer-events: none; }
    .controls { width: 100%; max-width: 480px; display: flex; gap: 8px; margin-top: 12px; }
    button { flex: 1; padding: 12px; font-size: 14px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; }
    .btn-scan { background: #2563eb; color: white; }
    .btn-export { background: #10b981; color: white; }
    .btn-clear { background: #ef4444; color: white; flex: 0 0 45px; }
    .status-card { width: 100%; max-width: 480px; background: #1e293b; padding: 10px; border-radius: 8px; margin-top: 10px; font-size: 13px; text-align: center; }
    .table-container { width: 100%; max-width: 480px; margin-top: 12px; flex-grow: 1; }
    ul { list-style: none; max-height: 200px; overflow-y: auto; background: #1e293b; border-radius: 8px; }
    li { display: flex; justify-content: space-between; padding: 8px 12px; border-bottom: 1px solid #334155; font-family: monospace; font-size: 13px; }
  </style>
</head>
<body>

  <div class="header">
    <h1>📦 Order ID Scanner</h1>
    <p style="font-size:12px; color:#94a3b8;">বক্সের মধ্যে শুধু আইডি রেখে স্ক্যান চাপুন</p>
  </div>

  <div class="camera-container">
    <video id="video" autoplay playsinline></video>
    <div class="viewfinder"></div>
    <canvas id="canvas" style="display:none;"></canvas>
  </div>

  <div class="controls">
    <button class="btn-scan" id="scanBtn" onclick="captureAndScan()">📷 স্ক্যান করুন</button>
    <button class="btn-export" onclick="exportExcel()">📥 Excel (CSV)</button>
    <button class="btn-clear" onclick="clearData()">🗑️</button>
  </div>

  <div class="status-card" id="statusBox">ক্যামেরা লোড হচ্ছে...</div>

  <div class="table-container">
    <h3 style="font-size: 14px; margin-bottom: 6px;">তালিকা: <span id="count">0</span> টি</h3>
    <ul id="itemsList"></ul>
  </div>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const statusBox = document.getElementById('statusBox');
    const itemsList = document.getElementById('itemsList');
    const countBadge = document.getElementById('count');
    const scanBtn = document.getElementById('scanBtn');
    let scannedData = JSON.parse(localStorage.getItem('saved_orders') || '[]');

    function updateUI() {
      itemsList.innerHTML = '';
      scannedData.slice().reverse().forEach((item, index) => {
        const li = document.createElement('li');
        li.innerHTML = `<span><strong>#${scannedData.length - index}</strong> ${item.id}</span> <span>${item.time}</span>`;
        itemsList.appendChild(li);
      });
      countBadge.innerText = scannedData.length;
      localStorage.setItem('saved_orders', JSON.stringify(scannedData));
    }

    navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
      .then(stream => { video.srcObject = stream; statusBox.innerText = "ক্যামেরা তৈরি!"; })
      .catch(err => { statusBox.innerText = "ক্যামেরা পারমিশন দিন"; });

    const patterns = [
      /\bOD\d{6,20}\b/i,
      /\b\d{3}-\d{2}-\d+\b/,
      /\b\d{10}-\d+\b/
    ];

    async function captureAndScan() {
      scanBtn.disabled = true;
      scanBtn.innerText = "পড়ছে...";
      statusBox.innerText = "🔍 স্ক্যান হচ্ছে, অপেক্ষা করুন...";

      const ctx = canvas.getContext('2d');
      const w = video.videoWidth || 640;
      const h = video.videoHeight || 480;
      const cropW = w * 0.85;
      const cropH = h * 0.3;
      canvas.width = cropW;
      canvas.height = cropH;

      ctx.drawImage(video, (w - cropW) / 2, (h - cropH) / 2, cropW, cropH, 0, 0, cropW, cropH);

      try {
        const worker = await Tesseract.createWorker('eng');
        const ret = await worker.recognize(canvas);
        await worker.terminate();

        const cleanText = ret.data.text.replace(/\s+/g, ' ').trim();
        let detectedId = null;

        for (let reg of patterns) {
          const m = cleanText.match(reg);
          if (m) { detectedId = m[0].toUpperCase(); break; }
        }

        if (detectedId) {
          if (!scannedData.some(d => d.id === detectedId)) {
            const now = new Date();
            scannedData.push({ id: detectedId, time: now.toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'}), date: now.toISOString().slice(0, 10) });
            updateUI();
            statusBox.innerHTML = `✅ সেভ হয়েছে: <b>${detectedId}</b>`;
          } else {
            statusBox.innerHTML = `⚠️ এটি আগেই স্ক্যান করা হয়েছে: <b>${detectedId}</b>`;
          }
        } else {
          statusBox.innerHTML = `❌ আইডি পাওয়া যায়নি। বক্সে ঠিকভাবে ধরে স্ক্যান করুন।`;
        }
      } catch (e) {
        statusBox.innerText = "সমস্যা হয়েছে, আবার চেষ্টা করুন।";
      } finally {
        scanBtn.disabled = false;
        scanBtn.innerText = "📷 স্ক্যান করুন";
      }
    }

    function exportExcel() {
      if (!scannedData.length) return alert("কোনো ডাটা নেই!");
      let csv = "Serial,Order ID,Date,Time\n";
      scannedData.forEach((row, i) => csv += `${i + 1},"${row.id}",${row.date},${row.time}\n`);
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = `Orders_${new Date().toISOString().slice(0,10)}.csv`;
      link.click();
    }

    function clearData() {
      if (confirm("সব ক্লিয়ার করবেন?")) {
        scannedData = [];
        updateUI();
      }
    }
    updateUI();
  </script>
</body>
</html>
